# Release: on a v* tag, run the checks and attach the prebuilt tarball to a
# GitHub Release. The tarball is the install path that needs neither npm
# nor pnpm's allowBuilds build approval (see awesome-dsh-plugin's
# contributing guide): storefronts offer it via the `tarball:` field.
#
# npm is published MANUALLY by the maintainer (npm login + npm publish);
# `prepack` builds the same prebuilt tarball, and the workflow's idempotence
# concern is gone because CI never touches the registry.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - name: Pack prebuilt tarball
        run: |
          pnpm pack
          # pnpm names the tarball after the FULL package name with the scope
          # flattened (ne-ilyxa-dsh-session-drafts-<version>.tgz); a fresh CI
          # workspace holds exactly one .tgz, so glob it instead of guessing.
          mv ./*.tgz dsh-session-drafts.tgz
      - name: Create GitHub Release with the tarball
        uses: softprops/action-gh-release@v2
        with:
          files: dsh-session-drafts.tgz
          generate_release_notes: true
