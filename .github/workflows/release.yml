# Release: on a v* tag, build the package and attach the prebuilt tarball to
# a GitHub Release. The tarball is the install path that needs neither npm
# nor pnpm's allowBuilds build approval (see awesome-dsh-plugin's
# contributing guide): storefronts offer it via the `tarball:` field.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - name: Pack prebuilt tarball
        run: |
          pnpm pack
          # pnpm names the tarball after the FULL package name with the scope
          # flattened (ne-ilyxa-dsh-session-drafts-<version>.tgz); a fresh CI
          # workspace holds exactly one .tgz, so glob it instead of guessing.
          mv ./*.tgz dsh-session-drafts.tgz
      - name: Create GitHub Release with the tarball
        uses: softprops/action-gh-release@v2
        with:
          files: dsh-session-drafts.tgz
          generate_release_notes: true

  # npm trusted publishing (OIDC): no stored tokens, no 2FA prompt — the
  # registry verifies the workflow's identity token against the publisher
  # registered on npmjs.com (Account Settings → Publishing access → Add
  # trusted publisher: repository ne-ilyxa/dsh-session-drafts, workflow
  # release.yml, environment release). Until that one-time registration
  # exists this job fails harmlessly and can be re-run after setup.
  publish-npm:
    needs: release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: npm publish --provenance --access public
